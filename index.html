<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C6E66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="השבוע שלי">
<title>השבוע שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#EEF3EF; --surface:#FFFFFF; --ink:#1B2A25; --muted:#5E6F68; --line:#D5DFD9;
  --malcha:#2C6E66; --malcha-soft:#DCEBE8;
  --arnona:#B8661A; --arnona-soft:#F6E6D3;
  --abroad:#3F66A8; --abroad-soft:#E0E8F5;
  --meds:#6F4796; --meds-soft:#ECE3F5;
  --done:#9AA8A2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101714; --surface:#18221E; --ink:#E6EEEA; --muted:#98A9A2; --line:#2A3833;
    --malcha:#6CC0B5; --malcha-soft:#1D3431; --arnona:#EBA462; --arnona-soft:#3A2A1B; --abroad:#8FB0E6; --abroad-soft:#1E2A3D;
    --meds:#C4A3E6; --meds-soft:#2C2238; --done:#5D6C66;
  }
}
:root[data-theme="dark"]{
  --ground:#101714; --surface:#18221E; --ink:#E6EEEA; --muted:#98A9A2; --line:#2A3833;
  --malcha:#6CC0B5; --malcha-soft:#1D3431; --arnona:#EBA462; --arnona-soft:#3A2A1B; --abroad:#8FB0E6; --abroad-soft:#1E2A3D;
  --meds:#C4A3E6; --meds-soft:#2C2238; --done:#5D6C66;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Assistant","Segoe UI",Arial,sans-serif; font-size:17px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:0 40px}
h1,h2,h3{font-family:"Secular One","Assistant",sans-serif; font-weight:400; margin:0; text-wrap:balance}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--malcha); outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* header */
header.top{padding-block:18px 10px; display:grid; gap:12px}
.weekbar{display:grid; gap:10px; padding-block:12px 4px}
.titlebar{display:flex; align-items:center; justify-content:space-between; gap:8px}
.titlebar h1{font-size:26px; line-height:1.1}
.titlebar .sub{color:var(--muted); font-size:14px}
.weeknav{display:flex; align-items:center; gap:6px}
.iconbtn{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; font-size:18px}
.whois{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:15px; color:var(--muted)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; background:var(--surface); padding:3px}
.seg button{border:0; background:transparent; padding:5px 14px; border-radius:999px; font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--ground)}
.unsure{font-size:13px; color:var(--arnona); font-weight:600}

.strip{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.dayp{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:6px 0 7px; display:grid; justify-items:center; gap:1px; position:relative}
.dayp .dn{font-size:13px; color:var(--muted); font-weight:600}
.dayp .dd{font-size:17px; font-weight:700}
.dayp .loc{width:22px; height:5px; border-radius:3px; margin-top:3px}
.dayp.malcha .loc{background:var(--malcha)}
.dayp.arnona .loc{background:var(--arnona)}
.dayp.abroad .loc{background:var(--abroad)}
.dayp.hol::before{content:""; position:absolute; top:5px; inset-inline-end:6px; width:6px; height:6px; border-radius:50%; background:var(--meds)}
.place.abroad{background:var(--abroad-soft); color:var(--abroad)}
.tag.abroad{background:var(--abroad-soft); color:var(--abroad)}
.mcell.abroad{background:var(--abroad-soft); color:var(--abroad)}
.holchip{display:inline-block; margin-inline-start:8px; font-size:13px; font-weight:700; color:var(--meds)}
.holbar{background:var(--meds-soft); color:var(--meds); border-radius:12px; padding:8px 12px; font-weight:600; font-size:15px}
.hmark{font-size:10px; color:var(--meds); font-weight:700}
.dayp[aria-current="date"]{border-color:var(--ink); border-width:2px; padding:5px 0 6px}
.dayp.today .dn::after{content:" •"; color:var(--meds)}
.legend{display:flex; gap:14px; font-size:13px; color:var(--muted)}
.legend i{display:inline-block; width:14px; height:5px; border-radius:3px; margin-inline-end:5px; vertical-align:middle}

/* sections */
section.view{display:grid; gap:14px; padding-top:6px}
.dayhead{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.dayhead h2{font-size:22px}
.place{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-weight:700; font-size:15px}
.place.malcha{background:var(--malcha-soft); color:var(--malcha)}
.place.arnona{background:var(--arnona-soft); color:var(--arnona)}

.timeline{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.item{display:grid; grid-template-columns:54px 1fr 40px; gap:10px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px}
.item .time{font-size:14px; color:var(--muted); padding-top:2px}
.item .kind{font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--muted)}
.item .what{font-weight:600}
.item .extra{font-size:14px; color:var(--muted)}
.item.meds{background:var(--meds-soft); border-color:transparent}
.item.meds .kind{color:var(--meds)}
.item.gym{background:var(--arnona-soft); border-color:transparent}
.item.gym .kind{color:var(--arnona)}
.pills{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.pill{background:var(--surface); color:var(--meds); border-radius:999px; padding:2px 10px; font-size:14px; font-weight:700}
.check{width:36px; height:36px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font-size:18px; color:transparent}
.check[aria-pressed="true"]{background:var(--malcha); border-color:var(--malcha); color:#fff}
.item.meds .check[aria-pressed="true"]{background:var(--meds); border-color:var(--meds)}
.item.is-done .what,.item.is-done .extra{color:var(--done); text-decoration:line-through; text-decoration-thickness:1px}
.linkbtn{background:none; border:0; padding:0; color:var(--malcha); font-weight:700; font-size:14px; text-decoration:underline; text-underline-offset:3px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; display:grid; gap:10px}
.panel h3{font-size:18px}
.note{font-size:14px; color:var(--muted)}
.btn{border:0; border-radius:12px; padding:12px 16px; font-weight:700; background:var(--ink); color:var(--ground)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
label.opt{display:flex; gap:8px; align-items:center; font-size:15px}
input[type="time"],input[type="text"]{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 10px}

/* week table */
.wk{display:grid; gap:8px}
.wkday{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; display:grid; gap:4px; text-align:start; width:100%}
.wkday .h{display:flex; justify-content:space-between; align-items:center; gap:8px}
.wkday .h b{font-size:16px}
.wkday .ln{font-size:14px; color:var(--muted)}
.wkday .ln span{color:var(--ink)}
.tag{font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px}
.tag.malcha{background:var(--malcha-soft); color:var(--malcha)}
.tag.arnona{background:var(--arnona-soft); color:var(--arnona)}

/* shopping */
.dept{display:grid; gap:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.dept h3{font-size:16px; padding:10px 14px; border-bottom:1px solid var(--line)}
.shop{display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:0}
.shop input{width:22px; height:22px; accent-color:var(--malcha)}
.shop .q{font-size:14px; color:var(--muted)}
.shop.got .n{color:var(--done); text-decoration:line-through}
.progress{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--malcha)}

/* recipes */
details.rc{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
details.rc summary{list-style:none; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:700}
details.rc summary::-webkit-details-marker{display:none}
details.rc summary .t{font-size:13px; color:var(--muted); font-weight:600; white-space:nowrap}
details.rc[open] summary{border-bottom:1px solid var(--line)}
.rcbody{padding:10px 14px 14px; display:grid; gap:8px; font-size:16px}
.rcbody ul,.rcbody ol{margin:0; padding-inline-start:20px; display:grid; gap:4px}
.subtabs{display:flex; gap:6px}
.subtabs button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-weight:600}
.subtabs button[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.snacklist{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.snacklist li{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; justify-content:space-between; gap:8px; align-items:center}

/* bottom nav */
nav.tabs{position:sticky; top:0; z-index:10; background:var(--ground); padding-block:6px}
nav.tabs .in{display:grid; grid-template-columns:repeat(6,1fr); background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.mgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.mh{font-size:12px; color:var(--muted); text-align:center; font-weight:700; padding-bottom:2px}
.mcell{border:0; border-radius:10px; padding:6px 2px 5px; min-height:60px; display:grid; align-content:start; justify-items:center; gap:1px; font-size:11px; font-weight:700}
.mcell.malcha{background:var(--malcha-soft); color:var(--malcha)}
.mcell.arnona{background:var(--arnona-soft); color:var(--arnona)}
.mcell .num{font-size:16px; color:var(--ink)}
.mcell .ok{color:var(--meds); font-size:12px; min-height:14px}
.mcell.out{opacity:.4}
.mcell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px; display:grid; gap:2px}
.stat b{font-size:22px; font-family:"IBM Plex Mono",monospace}
.stat span{font-size:13px; color:var(--muted)}
.wh{margin:6px 0 0; font-size:15px; color:var(--arnona)}
nav.tabs button{border:0; background:none; padding:8px 0 9px; display:grid; justify-items:center; gap:2px; font-size:12.5px; font-weight:600; color:var(--muted)}
nav.tabs button svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--ground); background:var(--malcha)}
.edited{font-size:11px; font-weight:700; color:var(--meds); background:var(--meds-soft); border-radius:999px; padding:1px 7px; letter-spacing:0}
.acts{display:flex; gap:16px; margin-top:4px}
.poolrow{display:flex; align-items:center; gap:8px; padding-block:4px; border-bottom:1px solid var(--line)}
.addform{display:grid; gap:6px; padding-top:6px}
.sheet{position:fixed; inset:0; background:rgba(10,20,16,.45); z-index:30; display:flex; align-items:flex-end; justify-content:center}
.sheetcard{background:var(--ground); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); display:grid; gap:12px}
.sheethead{display:flex; justify-content:space-between; align-items:start; gap:8px; position:sticky; top:-16px; background:var(--ground); padding-block:4px}
.picks{display:grid; gap:6px}
.picks h4{margin:8px 0 0; font-size:14px; color:var(--muted)}
.pick{display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.pick input[type=radio]{width:20px; height:20px; margin-top:2px; accent-color:var(--malcha); flex:none}
.pick:has(input[type=radio]:checked){border-color:var(--malcha); box-shadow:inset 0 0 0 1px var(--malcha)}
.toast{position:fixed; bottom:24px; inset-inline:16px; margin:0 auto; max-width:420px; background:var(--ink); color:var(--ground); padding:10px 14px; border-radius:12px; text-align:center; font-weight:600; z-index:40}
@media (prefers-reduced-motion:no-preference){ .check,.seg button{transition:background .15s, color .15s} }
@media print{ nav.tabs,header.top .weeknav{display:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlebar">
      <div>
        <h1>השבוע שלי</h1>
        <div class="sub" id="weekLabel"></div>
      </div>
      <div class="weeknav">
        <button class="iconbtn" id="prevWeek" aria-label="שבוע קודם">›</button>
        <button class="iconbtn" id="todayBtn" aria-label="חזרה להיום" style="width:auto;padding-inline:12px;border-radius:999px;font-size:14px;font-weight:700">היום</button>
        <button class="iconbtn" id="nextWeek" aria-label="שבוע הבא">‹</button>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="ניווט">
    <div class="in" role="tablist">
      <button role="tab" data-tab="day" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>יום</button>
      <button role="tab" data-tab="week" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>שבוע</button>
      <button role="tab" data-tab="month" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>חודש</button>
      <button role="tab" data-tab="shop" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>קניות</button>
      <button role="tab" data-tab="gym" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>כושר</button>
      <button role="tab" data-tab="recipes" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>מתכונים</button>
    </div>
  </nav>

  <div class="weekbar">
    <div class="whois" id="weekPlace"></div>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"><span><i style="background:var(--malcha)"></i>מלחה</span><span><i style="background:var(--arnona)"></i>ארנונה + חדר כושר</span></div>
  </div>

  <main>
    <section class="view" id="view-day"></section>
    <section class="view" id="view-week" hidden></section>
    <section class="view" id="view-month" hidden></section>
    <section class="view" id="view-shop" hidden></section>
    <section class="view" id="view-gym" hidden></section>
    <section class="view" id="view-recipes" hidden></section>
  </main>
</div>
<div class="sheet" id="sheet" hidden><div class="sheetcard" role="dialog" aria-modal="true" aria-label="עריכת ארוחה" id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ נתונים ============ */
const MEDS_AM = ["קיסגדו","אסציטלופרם","טריטייס"];

function phaseFor(n){ return n < 1 ? null : PHASES.find(p => n >= p.from && n <= p.to); }

function gymWeek(sunday){
  const n = weeksBetween(parse(S.gymStart), sunday) + 1, ph = phaseFor(n), days = {};
  if(!ph) return {n, ph, days};
  const ar = [0,1,2,3,4,5].filter(i => {
    const h = HOLIDAYS[iso(addDays(sunday, i))];
    return placeFor(sunday, i) === "arnona" && !(h && h.t === "chag");
  });
  ar.forEach((d, j) => days[d] = ((n - 1 + j) % 2) ? "B" : "A");
  return {n, ph, days};
}

function rotationFor(sunday, dayIdx){
  const w = ((weeksBetween(parse(BASE_WEEK), sunday) % 100) + 100) % 100;
  const pick = (slot, n) => { const p = pool(slot); return p[n % p.length]; };
  return {
    breakfast: pick("breakfast", dayIdx + w),
    snackAm: pick("snackAm", dayIdx + w),
    lunch: pick("lunch", dayIdx + w*3),
    snackPm: pick("snackPm", dayIdx*2 + w*5),
    dinner: pick("dinner", dayIdx + w*2)
  };
}
function planFor(sunday, dayIdx){
  const base = rotationFor(sunday, dayIdx), dIso = iso(addDays(sunday, dayIdx)), plan = {edited:{}};
  for(const slot in SLOTS){
    const o = S.over[`${dIso}:${slot}`];
    let dish = base[slot];
    if(o && o.id){ const f = findDish(slot, o.id); if(f) dish = f; }
    if(o && o.text) dish = {id:null, n:o.text, ingText:o.ing || ""};
    plan[slot] = dish;
    plan.edited[slot] = !!o && dish !== base[slot];
  }
  return plan;
}
function itemsFor(sunday, dayIdx){
  const p = planFor(sunday, dayIdx), place = placeFor(sunday, dayIdx), out = [];
  const meal = (slot, time, kind) => out.push({id:slot, slot, time, kind, what:p[slot].n, extra:dishExtra(slot, p[slot]), r:p[slot].r, edited:p.edited[slot]});

  const holNote = hol && hol.t === "erev" ? "ערב חג — חדר הכושר נסגר מוקדם, עדיף להגיע בבוקר."
                : hol && hol.t === "moed" ? "חול המועד — כדאי לבדוק שעות פתיחה." : "";
  if(place === "arnona"){
    const g = gymWeek(sunday), type = g.days[dayIdx];
    if(g.ph && type) out.push({id:"gym", time:S.gymTime, kind:`חדר כושר · שבוע ${g.n}`, cls:"gym", what:`אימון ${TL[type]} · ${g.ph.minutes} דק׳`, extra:[holNote, workoutSummary(g.ph, type)].filter(Boolean).join(" "), workout:dIso});
    else if(g.ph && hol && hol.t === "chag") out.push({id:"gym", time:S.gymTime, kind:"תנועה קלה", cls:"gym", what:`${hol.n} — חדר הכושר סגור`, extra:"מנוחה או הליכה נינוחה. חג שמח!"});
    else if(g.ph) out.push({id:"gym", time:S.gymTime, kind:"תנועה קלה", cls:"gym", what:"שבת — מנוחה או הליכה נינוחה", extra:"גם מנוחה היא חלק מהתוכנית."});
    else out.push({id:"gym", time:S.gymTime, kind:"חדר כושר", cls:"gym", what:"התוכנית עוד לא התחילה", extra:"אפשר לקבוע את שבוע ההתחלה בלשונית כושר"});
  }
  const fastNote = hol && (hol.fast || hol.t === "fast") ? "יום צום — אם צמה, לבדוק מראש עם הרופא/ה איך לקחת את התרופות." : "";
  const abroadNote = place === "abroad" ? "בחו״ל: לוקחים באותה שעה מקומית. אם יש הפרש שעות גדול — לבדוק מראש עם הרוקח/ת." : "";
  // יום לפני הטיסה — תזכורת לארוז תרופות
  const nextTrip = TRIPS.find(t => t.place === "abroad" && t.from === iso(addDays(sunday, dayIdx + 1)));
  if(nextTrip){
    const days = Math.round((parse(nextTrip.to) - parse(nextTrip.from)) / 864e5) + 1;
    out.push({id:"pack", time:"21:00", kind:"לפני הטיסה", cls:"meds", what:"לארוז תרופות לתיק היד", extra:`ל-${days} ימים ועוד 2 ימי רזרבה.`, pills:[...MEDS_AM, ...MEDS_PM]});
  }
  out.push({id:"medsAm", time:"08:00", kind:"תרופות בוקר", cls:"meds", what:"לקחת תרופות", extra:[fastNote, abroadNote].filter(Boolean).join(" "), pills:MEDS_AM});
  if(place === "abroad"){
    out.push({id:"trip", time:"12:00", kind:"חופשה", what:"בלי תפריט — נהנים", extra:"אם אפשר: חלבון וירקות בכל ארוחה, הרבה מים והרבה הליכה."});
  } else {
    meal("breakfast", "08:15", "בוקר");
    meal("snackAm", "10:30", "ביניים");
    meal("lunch", "13:00", "צהריים");
    meal("snackPm", "16:30", "ביניים");
    meal("dinner", "19:00", "ערב");
  }
  out.push({id:"medsPm", time:"20:00", kind:"תרופות ערב", cls:"meds", what:"לקחת תרופות", extra:abroadNote, pills:MEDS_PM});
  out.sort((a,b) => a.time.localeCompare(b.time));
  return out;
}

function saveEditor(){
  const {dIso, slot, baseId} = editing, key = `${dIso}:${slot}`;
  const sel = document.querySelector("input[name=edPick]:checked");
  if(!sel){ toast("בחרי מנה או כתבי משהו אחר"); return; }
  if(sel.value === "__text"){
    const text = $("edText").value.trim(), ing = $("edIng").value.trim();
    if(!text){ toast("כתבי מה אוכלים"); $("edText").focus(); return; }
    if($("edAddPool").checked){
      const dish = {id:`c${Date.now()}`, n:text, ingText:ing};
      (S.custom[slot] = S.custom[slot] || []).push(dish);
      S.over[key] = {id:dish.id};
    } else S.over[key] = {text, ing};
  } else if(sel.value === baseId) delete S.over[key];
  else S.over[key] = {id:sel.value};
  if($("edHideOrig").checked){
    const h = S.hidden[slot] = S.hidden[slot] || [];
    if(!h.includes(baseId)) h.push(baseId);
    if(S.over[key] && S.over[key].id === baseId) delete S.over[key];
  }
  closeEditor(); render(); toast("נשמר");
}

function shopKey(){ return iso(weekStart); }
function buildShopping(){
  const tot = {}, mine = {};
  const add = obj => { for(const k in obj) tot[k] = (tot[k]||0) + obj[k]; };
  for(let i=0;i<7;i++){
    if(placeFor(weekStart,i) === "abroad") continue;
    const p = planFor(weekStart,i);
    for(const slot in SLOTS){
      const dish = p[slot];
      if(dish.i){
        if(slot === "breakfast") add(BREAKFAST_BASE);
        if(slot === "dinner") add(DINNER_BASE);
        add(dish.i);
      } else if(dish.ingText){
        dish.ingText.split(/[,،\n]/).map(x => x.trim()).filter(Boolean).forEach(x => mine[x] = (mine[x]||0) + 1);
      }
    }
  }
  for(const k of ALWAYS) tot[k] = Math.max(tot[k]||0, 1);
  const groups = {};
  const mineRows = Object.entries(mine).map(([n,c]) => ({k:"m:"+n, n, txt: c > 1 ? `×${c}` : ""}));
  if(mineRows.length) groups.mine = mineRows;
  for(const k in tot){
    const g = ING[k]; let q = tot[k], txt;
    if(ALWAYS.includes(k)) g.d = "always";
    if(g.u === "גרם"){ q = Math.max(50, Math.ceil(q/50)*50); txt = q >= 1000 ? `${(q/1000).toFixed(q%1000?1:0)} ק״ג` : `${q} גרם`; }
    else { q = Math.ceil(q - 0.05); txt = `${q} ${g.u}`; }
    (groups[g.d] = groups[g.d] || []).push({k, n:g.n, txt});
  }
  return groups;
}
function shopAlerts(){
  const out = [];
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i), h = HOLIDAYS[iso(d)];
    if(h && h.t === "chag") out.push(`✡ ${h.n} (${DAY_NAMES[i]} ${fmt(d)}) — החנויות סגורות. לקנות עד הצהריים של יום קודם.`);
  }
  const abroad = [0,1,2,3,4,5,6].filter(i => placeFor(weekStart,i) === "abroad");
  if(abroad.length) out.push(`✈ בימים ${abroad.map(i => DAY_SHORT[i]).join(" ")} את בחו״ל — הם לא נכללים ברשימה. לא לקנות ירקות ומוצרי חלב מעבר לימים שלפני הטיסה.`);
  return out.map(x => `<div class="holbar">${x}</div>`).join("");
}
function renderShop(){
  const st = S.shop[shopKey()] = S.shop[shopKey()] || {got:{}, extra:[]};
  const groups = buildShopping();
  let all = 0, got = 0, text = [`קניות לשבוע ${fmt(weekStart)}`];
  const row = (id, name, q) => { all++; const on = !!st.got[id]; if(on) got++;
    return `<label class="shop${on?" got":""}"><input type="checkbox" data-shop="${esc(id)}" ${on?"checked":""}><span class="n">${esc(name)}</span><span class="q mono">${esc(q)}</span></label>`; };
  const html = Object.keys(DEPTS).filter(d => groups[d]).map(d => {
    text.push(`\n${DEPTS[d]}:`);
    const rows = groups[d].sort((a,b)=> d==="mine" ? 0 : d==="always" ? ALWAYS.indexOf(a.k)-ALWAYS.indexOf(b.k) : a.n.localeCompare(b.n,"he")).map(x => { text.push(`• ${x.n} — ${x.txt}`); return row(x.k, x.n, x.txt); }).join("");
    return `<div class="dept"><h3>${DEPTS[d]}</h3>${rows}</div>`;
  }).join("");
  const extra = st.extra.length ? `<div class="dept"><h3>הוספתי בעצמי</h3>${st.extra.map((x,i)=>{ text.push(`• ${x}`); return row("x:"+x, x, ""); }).join("")}</div>` : "";
  const staples = `<div class="dept"><h3>לוודא שיש בבית</h3>${STAPLES.map(s => row("s:"+s, s, "")).join("")}</div>`;
  renderShop.text = text.join("\n");
  $("view-shop").innerHTML = `
    <div class="dayhead"><h2>רשימת קניות</h2><span class="note mono">${got}/${all}</span></div>
    <div class="progress"><i style="width:${all?Math.round(got/all*100):0}%"></i></div>
    <p class="note" style="margin:0">מחושב מהתפריט של השבוע ${fmt(weekStart)}–${fmt(addDays(weekStart,6))}. הכמויות למנה אחת ליום.</p>
    ${shopAlerts()}
    <div class="row">
      <input type="text" id="extraItem" placeholder="להוסיף פריט…" style="flex:1;min-width:0">
      <button class="btn" id="addExtra">הוספה</button>
    </div>
    ${html}${extra}${staples}
    <div class="row">
      <button class="btn" id="shareShop">שליחה בוואטסאפ</button>
      <button class="btn ghost" id="copyShop">העתקה</button>
      <button class="btn ghost" id="resetShop">ניקוי סימונים</button>
    </div>`;
}

        <div class="rcbody">
          <b>מצרכים</b><ul>${r.ing.map(x=>`<li>${x}</li>`).join("")}</ul>
          <b>הכנה</b><ol>${r.steps.map(x=>`<li>${x}</li>`).join("")}</ol>
        </div>
      </details>`).join("");
  }).join("");
  const snackRow = s => `<li><span>${s.n}</span>${s.r?`<button class="linkbtn" data-recipe="${s.r}">מתכון</button>`:""}</li>`;
  const snacks = `
    <h3 style="font-size:17px">עם יוגורט</h3><ul class="snacklist">${SNACKS_AM.map(snackRow).join("")}</ul>
    <h3 style="font-size:17px">בלי יוגורט — לגיוון</h3><ul class="snacklist">${SNACKS_PM.map(snackRow).join("")}</ul>
    <p class="note">כל רעיון כאן כבר נכנס לסבב: בוקר מקבלים ביניים עם יוגורט, אחר הצהריים ביניים אחרת, והתפריט מתחלף משבוע לשבוע.</p>`;
  const salads = `
    <p class="note" style="margin:0">הבסיס תמיד: ${DINNER_BASE_TEXT}. כל ערב מוסיפים משהו אחר:</p>
    <ul class="snacklist">${DINNERS.map(s => `<li style="display:grid;gap:2px;justify-content:stretch"><b>${s.n}</b><span class="note">${s.d}</span>${s.r?`<button class="linkbtn" style="justify-self:start" data-recipe="${s.r}">לרטבים</button>`:""}</li>`).join("")}</ul>`;
  const titles = {recipes:"מתכונים קלים", snacks:"רעיונות לביניים", salads:"סלטים לערב"};
  $("view-recipes").innerHTML = `
    <div class="dayhead"><h2>${titles[recipeSub]}</h2></div>
    <div class="subtabs">
      <button data-sub="recipes" aria-pressed="${recipeSub==="recipes"}">מתכונים</button>
      <button data-sub="salads" aria-pressed="${recipeSub==="salads"}">סלטים</button>
      <button data-sub="snacks" aria-pressed="${recipeSub==="snacks"}">ביניים</button>
    </div>
    ${recipeSub==="recipes" ? rec : recipeSub==="salads" ? salads : snacks}`;
  if(openId){ const el = document.getElementById("rc-"+openId); if(el) el.scrollIntoView({block:"center"}); }
}

function renderMonth(){
  const y = monthCur.getFullYear(), mo = monthCur.getMonth();
  const first = new Date(y, mo, 1), start = sundayOf(first);
  const last = new Date(y, mo+1, 0);
  const cells = Math.ceil((weeksBetween(start, sundayOf(last)) + 1)) * 7;
  const todayIso = iso(today);
  let malcha = 0, gym = 0, medsDays = 0, pastDays = 0, html = "";
  const holList = [];
  for(let i=0;i<cells;i++){
    const d = addDays(start, i), sun = sundayOf(d), di = d.getDay(), place = placeFor(sun, di), dIso = iso(d);
    const inMonth = d.getMonth() === mo, h = HOLIDAYS[dIso], isGym = !!gymWeek(sun).days[di];
    const medsOk = S.checks[`${dIso}:medsAm`] && S.checks[`${dIso}:medsPm`];
    if(inMonth){
      if(place === "malcha") malcha++;
      if(isGym) gym++;
      if(dIso <= todayIso){ pastDays++; if(medsOk) medsDays++; }
      if(h && h.t !== "moed" && h.t !== "info") holList.push(`${d.getDate()}.${mo+1} ${h.n}`);
    }
    const label = place === "malcha" ? "מלחה" : place === "abroad" ? "חו״ל" : isGym ? "כושר" : "ארנונה";
    html += `<button class="mcell ${place}${inMonth?"":" out"}${dIso===todayIso?" today":""}" data-date="${dIso}" aria-label="${DAY_NAMES[di]} ${fmt(d)}, ${PLACE_NAME[place]}${h?", "+h.n:""}">
      <span class="num mono">${d.getDate()}</span><span>${label}</span><span class="ok">${h ? `<span class="hmark">${h.t==="moed"?"חוה״מ":h.t==="erev"?"ערב חג":h.t==="fast"?"צום":h.t==="info"?"בחירות":"חג"}</span>` : medsOk?"💊✓":""}</span></button>`;
  }
  $("view-month").innerHTML = `
    <div class="legend" style="flex-wrap:wrap"><span><i style="background:var(--malcha)"></i>מלחה</span><span><i style="background:var(--arnona)"></i>ארנונה</span><span><i style="background:var(--abroad)"></i>חו״ל</span><span>💊✓ תרופות סומנו</span></div>
    <div class="mgrid">${DAY_SHORT.map(n=>`<div class="mh">${n}</div>`).join("")}${html}</div>
    <div class="stats">
      <div class="stat"><b>${malcha}</b><span>ימים במלחה</span></div>
      <div class="stat"><b>${gym}</b><span>אימונים מתוכננים</span></div>
      <div class="stat"><b>${medsDays}/${pastDays}</b><span>ימים עם כל התרופות</span></div>
    </div>
    ${holList.length ? `<div class="panel"><h3>חגים החודש</h3>${holList.map(x => `<div>✡ ${x}</div>`).join("")}<p class="note" style="margin:0">בחג אין אימון, ועושים קניות מראש. בערב חג חדר הכושר והחנויות נסגרים מוקדם.</p></div>` : ""}
    ${TRIPS.filter(t => parse(t.from).getMonth() === mo || parse(t.to).getMonth() === mo).map(t => `<div class="holbar">✈ ${fmt(parse(t.from))}–${fmt(parse(t.to))}: ${t.n}</div>`).join("")}
    <p class="note" style="margin:0">לוחצים על יום כדי לראות את התפריט והתרופות שלו.</p>`;
}

function render(){
  renderHeader();
  document.querySelector(".weekbar").hidden = tab === "month";
  for(const t of ["day","week","month","shop","gym","recipes"]) $("view-"+t).hidden = t !== tab;
  if(tab==="gym") renderGym();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  if(tab==="day") renderDay();
  if(tab==="week") renderWeek();
  if(tab==="month") renderMonth();
  if(tab==="shop") renderShop();
  if(tab==="recipes") renderRecipes();
  save();
}

function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>t.hidden=true, 2200); }

/* ============ קובץ תזכורות ליומן ============ */
function icsEsc(s){ return s.replace(/[\\,;]/g, m => "\\"+m); }
function stamp(d, hhmm){ const [h,m] = hhmm.split(":"); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${h}${m}00`; }
function vevent(uid, d, time, title, desc, rrule){
  const now = new Date(), dt = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const [h,m] = time.split(":").map(Number); const endM = h*60+m+15;
  const end = `${stamp(d, `${pad(Math.floor(endM/60)%24)}:${pad(endM%60)}`)}`;
  return ["BEGIN:VEVENT",`UID:${uid}@hashavua-sheli`,`DTSTAMP:${dt}`,`DTSTART;TZID=Asia/Jerusalem:${stamp(d,time)}`,`DTEND;TZID=Asia/Jerusalem:${end}`,
    rrule||null, `SUMMARY:${icsEsc(title)}`, desc?`DESCRIPTION:${icsEsc(desc)}`:null,
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(title)}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].filter(Boolean);
}
function downloadIcs(name, events){
  const body = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//hashavua-sheli//HE","CALSCALE:GREGORIAN","METHOD:PUBLISH", ...events.flat(), "END:VCALENDAR"].join("\r\n");
  const url = URL.createObjectURL(new Blob([body], {type:"text/calendar;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast("הקובץ ירד — פותחים אותו ומוסיפים ליומן");
}
function icsWeek(){
  const meals = $("icsMeals") && $("icsMeals").checked, ev = [];
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i), di = iso(d);
    for(const it of itemsFor(weekStart,i)){
      const isMeal = !it.cls;
      if(isMeal && !meals) continue;
      const title = it.cls==="meds" ? `💊 ${it.kind}: ${it.pills.join(", ")}` : it.cls==="gym" ? `🏋️ ${it.what}` : `${it.kind}: ${it.what}`;
      ev.push(vevent(`${di}-${it.id}`, d, it.time, title, it.extra||""));
    }
  }
  downloadIcs(`תזכורות-${fmt(weekStart)}.ics`, ev);
}
function icsMeds(){
  const d = today;
  downloadIcs("תרופות-כל-יום.ics", [
    vevent("meds-am-daily", d, "08:00", `💊 תרופות בוקר: ${MEDS_AM.join(", ")}`, "", "RRULE:FREQ=DAILY"),
    vevent("meds-pm-daily", d, "20:00", `💊 תרופות ערב: ${MEDS_PM.join(", ")}`, "", "RRULE:FREQ=DAILY")
  ]);
}

/* ============ אירועים ============ */
document.addEventListener("click", async e => {
  if(e.target.id === "sheet"){ closeEditor(); return; }
  const t = e.target.closest("button, input[type=checkbox]");
  if(!t) return;
  if(t.dataset.workout){ openWorkout(t.dataset.workout); return; }
  if(t.id === "wDone" && editing && editing.workout){
    const k = `${editing.workout}:gym`;
    if(S.checks[k]) delete S.checks[k]; else S.checks[k] = 1;
    const wasDone = !!S.checks[k]; closeEditor(); render(); if(wasDone) toast("כל הכבוד! עוד אימון בפנים 💪");
    return;
  }
  if(t.dataset.edit){ const [dIso, slot] = t.dataset.edit.split("|"); openEditor(dIso, slot); return; }
  if(t.dataset.pool){
    const [slot, id] = t.dataset.pool.split("|"), h = S.hidden[slot] = S.hidden[slot] || [];
    if(t.checked) S.hidden[slot] = h.filter(x => x !== id);
    else { if(allDishes(slot).length - h.length <= 1){ t.checked = true; toast("צריך להשאיר לפחות מנה אחת בסבב"); return; } h.push(id); }
    const open = [...document.querySelectorAll("#view-week details.rc")].map(x => x.open);
    render(); document.querySelectorAll("#view-week details.rc").forEach((x,i) => x.open = open[i]);
    return;
  }
  if(t.dataset.delcustom){
    const [slot, id] = t.dataset.delcustom.split("|");
    S.custom[slot] = (S.custom[slot]||[]).filter(d => d.id !== id);
    for(const k in S.over) if(S.over[k].id === id) delete S.over[k];
    const open = [...document.querySelectorAll("#view-week details.rc")].map(x => x.open);
    render(); document.querySelectorAll("#view-week details.rc").forEach((x,i) => x.open = open[i]); toast("המנה נמחקה");
    return;
  }
  if(t.dataset.addcustom){
    const slot = t.dataset.addcustom, n = $("new-"+slot).value.trim();
    if(!n){ toast("כתבי שם למנה"); $("new-"+slot).focus(); return; }
    (S.custom[slot] = S.custom[slot] || []).push({id:`c${Date.now()}`, n, ingText:$("newing-"+slot).value.trim()});
    const open = [...document.querySelectorAll("#view-week details.rc")].map(x => x.open);
    render(); document.querySelectorAll("#view-week details.rc").forEach((x,i) => x.open = open[i]); toast("נוסף לסבב");
    return;
  }
  if(t.dataset.day){ selDay = +t.dataset.day; tab = "day"; render(); return; }
  if(t.dataset.date){ const d = parse(t.dataset.date); weekStart = sundayOf(d); selDay = d.getDay(); tab = "day"; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.goday){ selDay = +t.dataset.goday; tab = "day"; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.tab){ tab = t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.check){ const k = t.dataset.check; if(S.checks[k]) delete S.checks[k]; else S.checks[k] = 1; render(); return; }
  if(t.dataset.recipe){ tab = "recipes"; recipeSub = "recipes"; render(); renderRecipes(t.dataset.recipe); return; }
  if(t.dataset.sub){ recipeSub = t.dataset.sub; renderRecipes(); return; }
  if(t.dataset.shop !== undefined){ const st = S.shop[shopKey()]; if(t.checked) st.got[t.dataset.shop]=1; else delete st.got[t.dataset.shop]; renderShop(); save(); return; }
  switch(t.id){
    case "prevWeek": if(tab==="month") monthCur = new Date(monthCur.getFullYear(), monthCur.getMonth()-1, 1); else weekStart = addDays(weekStart,-7); render(); break;
    case "nextWeek": if(tab==="month") monthCur = new Date(monthCur.getFullYear(), monthCur.getMonth()+1, 1); else weekStart = addDays(weekStart,7); render(); break;
    case "todayBtn": weekStart = sundayOf(today); selDay = today.getDay(); monthCur = new Date(today.getFullYear(), today.getMonth(), 1); if(tab!=="month") tab = "day"; render(); break;
    case "edSave": saveEditor(); break;
    case "edCancel": closeEditor(); break;
    case "edReset": delete S.over[`${editing.dIso}:${editing.slot}`]; closeEditor(); render(); toast("חזר להצעה המקורית"); break;
    case "icsWeek": icsWeek(); break;
    case "icsMeds": icsMeds(); break;
    case "addExtra": { const v = $("extraItem").value.trim(); if(v){ S.shop[shopKey()].extra.push(v); renderShop(); save(); } break; }
    case "resetShop": S.shop[shopKey()].got = {}; renderShop(); save(); toast("הסימונים נוקו"); break;
    case "shareShop": window.open("https://wa.me/?text=" + encodeURIComponent(renderShop.text), "_blank"); break;
    case "copyShop":
      try{ await navigator.clipboard.writeText(renderShop.text); toast("הרשימה הועתקה"); }
      catch(err){ const ta = document.createElement("textarea"); ta.value = renderShop.text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("הרשימה הועתקה"); }catch(_){ toast("לא הצלחתי להעתיק — אפשר לשלוח בוואטסאפ"); } ta.remove(); }
      break;
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "gymTime" && e.target.value){ S.gymTime = e.target.value; save(); }
  if(e.target.id === "gymStart" && e.target.value){ S.gymStart = iso(sundayOf(parse(e.target.value))); render(); toast("שבוע ההתחלה עודכן"); }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && editing) closeEditor();if(e.key === "Enter" && e.target.id === "extraItem") $("addExtra").click(); });

render();
</script>
